<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - prompts workspace</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Navegue pelas categorias e copie prompts otimizados para programadores, criadores de conteúdo e profissionais.">
    <meta name="keywords" content="prompts, biblioteca de prompts, inteligencia artificial, design, ui, premium">
    
    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- App Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <a href="index.html" class="logo" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
                <span class="logo-dot"></span>
                <span class="logo-text">prompts workspace</span>
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link btn-minimal">Voltar ao Início</a>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main class="main-content" style="max-width: 1200px; padding: 20px 24px 80px;">
            <div class="hero-section" style="margin-bottom: 30px;">
                <div class="badge">Acesso ao acervo completo</div>
                <h1 class="hero-title">Biblioteca de Prompts</h1>
                <p class="hero-subtitle">Explore instruções profissionais projetadas para otimizar suas interações com as principais Inteligências Artificiais.</p>
            </div>

            <!-- Library Content Section -->
            <div class="library-page-container" style="width: 100%;">
                
                <!-- Search Box -->
                <div class="search-row">
                    <div class="search-box">
                        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="library-search" placeholder="Buscar por prompts, tags ou funções...">
                    </div>
                    <button class="btn-ai-search" id="btn-ai-search-lib" title="Buscar com IA">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"></path></svg>
                        Buscar com IA
                    </button>
                </div>

                <!-- Rounded Category Pill Bar (Barrinha com as pontas arredondadas) -->
                <div class="categories-pill-bar-wrapper" style="display: flex; justify-content: center; margin-bottom: 40px; width: 100%;">
                    <div class="categories-pill-bar">
                        <button class="category-pill-btn active" data-category="all">Todos</button>
                        <button class="category-pill-btn" data-category="dev">Programação</button>
                        <button class="category-pill-btn" data-category="marketing">Marketing & Copy</button>
                        <button class="category-pill-btn" data-category="writing">Escrita & Tradução</button>
                        <button class="category-pill-btn" data-category="prod">Produtividade</button>
                        <button class="category-pill-btn" data-category="design">Design & Arte</button>
                        <button class="category-pill-btn" data-category="business">Negócios</button>
                        <button class="category-pill-btn" data-category="education">Educação</button>
                        <button class="category-pill-btn" data-category="custom">Meus Prompts</button>
                    </div>
                </div>

                <!-- Prompts Grid Container -->
                <div class="prompts-grid" id="library-prompts-container">
                    <!-- Prompts will be dynamically generated by JS -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="main-footer">
            <p class="copyright">&copy; 2026 prompts workspace. Todos os direitos reservados.</p>
            <p class="inspired-by">Engineered with Google Gemini</p>
        </footer>
    </div>

    <!-- Toast Notifications Area -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Page Scripts -->
    <script src="api-shared.js" defer></script>
    <script src="biblioteca.js" defer></script>
</body>
</html>
